<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Master">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Master</title>
<style>
:root{
  --bg:#0e0f12; --panel:#17191e; --line:#262931; --ink:#f2f3f5; --sub:#8b909c; --dim:#5a5f6b;
  --ok:#3ecf8e; --ng:#ff5d5d; --gold:#f5c542; --accent:#7aa2ff;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:calc(var(--safe-t) + 16px) 16px 16px}
.screen.on{display:flex}
h1{font-size:13px;letter-spacing:.14em;color:var(--sub);font-weight:600;margin:0 0 14px}
.big{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--ink);color:#000;font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--sub)}
.ring{position:relative;width:200px;height:200px;margin:8px auto 18px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.chip.on{background:var(--ink);color:#000;border-color:var(--ink)}
/* tab bar */
nav{display:flex;border-top:1px solid var(--line);background:rgba(14,15,18,.96);padding-bottom:var(--safe-b)}
nav button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ink)}
nav svg{width:22px;height:22px}
body.playing nav{display:none}
/* play */
#play{padding-bottom:calc(var(--safe-b) + 12px)}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.iconbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn:disabled{opacity:.25}
#count{font-size:13px;color:var(--sub);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0;min-height:0}
.tag{font-size:11px;letter-spacing:.12em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-bottom:14px}
.tag.new{color:var(--accent);border-color:var(--accent)}
.tag.rev{color:var(--gold);border-color:var(--gold)}
.tag.again{color:var(--ng);border-color:var(--ng)}
#front{font-size:44px;font-weight:700;letter-spacing:-.01em;word-break:break-word;line-height:1.15}
#photo{width:min(64vw,260px);aspect-ratio:1;border-radius:20px;object-fit:cover;object-position:50% 22%;background:var(--panel);display:none}
#back{margin-top:22px;min-height:120px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
#back.show{opacity:1;transform:none}
#back .jp{font-size:24px;font-weight:600;line-height:1.45}
#back .kana{font-size:14px;color:var(--sub);margin-top:4px}
#back .sub{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.5;max-width:340px}
#back .ses{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5;max-width:340px}
#hint{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:18px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer button{padding:20px 0;border-radius:16px;font-size:18px;font-weight:700;border:1px solid var(--line)}
#bNg{color:var(--ng)} #bOk{color:#000;background:var(--ok);border-color:var(--ok)}
.answer.wait button{opacity:.15;pointer-events:none}
#combo{font-size:12px;color:var(--gold);height:16px;text-align:center;margin-bottom:6px}
/* done */
.done{text-align:center;padding-top:40px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--dim);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--sub);position:relative}
.cal .d.has{background:var(--panel);color:var(--ink)}
.cal .d.goal{background:var(--gold);color:#000;font-weight:700}
.cal .d.today{outline:1px solid var(--ink)}
.cal .d small{font-size:9px;opacity:.8}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.levels{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0 4px}
.levels i{display:block;height:100%}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.set label{font-size:15px}
.set .v{font-size:13px;color:var(--sub);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.set input[type=range]{width:42%;accent-color:var(--ink)}
.set select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;max-width:52%;font-size:13px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:21px}
.small{font-size:12px;color:var(--dim);line-height:1.6}
.test{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#000;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>

<!-- 単語 -->
<section class="screen on" id="sWords">
  <h1>TOEIC 単語</h1>
  <div class="ring"><svg width="200" height="200"><circle cx="100" cy="100" r="88" stroke="#262931" stroke-width="12" fill="none"/><circle id="wRing" cx="100" cy="100" r="88" stroke="#f2f3f5" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
    <div class="in"><div class="big" id="wDone">0</div><div class="muted" id="wOf">/ 200 語</div></div></div>
  <div class="muted" style="text-align:center;margin-bottom:16px" id="wMix"></div>
  <button class="btn" id="wStart">スタート</button>
  <button class="btn ghost" id="wMore" style="margin-top:10px;display:none">＋100語</button>
  <div class="stats">
    <div class="stat"><b id="wLearned">0</b><span>定着</span></div>
    <div class="stat"><b id="wDue">0</b><span>明日の復習</span></div>
    <div class="stat"><b id="wNew">0</b><span>未出題</span></div>
  </div>
</section>

<!-- 顔 -->
<section class="screen" id="sFaces">
  <h1>クリエイティブ ― 顔と名前</h1>
  <div class="chips" id="gChips"></div>
  <div class="ring"><svg width="200" height="200"><circle cx="100" cy="100" r="88" stroke="#262931" stroke-width="12" fill="none"/><circle id="pRing" cx="100" cy="100" r="88" stroke="#f2f3f5" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
    <div class="in"><div class="big" id="pDone">0</div><div class="muted" id="pOf">/ 30 人</div></div></div>
  <div class="muted" style="text-align:center;margin-bottom:16px" id="pMix"></div>
  <button class="btn" id="pStart">スタート</button>
  <button class="btn ghost" id="pMore" style="margin-top:10px;display:none">＋20人</button>
  <div class="stats">
    <div class="stat"><b id="pLearned">0</b><span>定着</span></div>
    <div class="stat"><b id="pDue">0</b><span>明日の復習</span></div>
    <div class="stat"><b id="pNew">0</b><span>未出題</span></div>
  </div>
</section>

<!-- 記録 -->
<section class="screen" id="sLog">
  <h1>記録</h1>
  <div class="stats" style="margin-top:0;margin-bottom:14px">
    <div class="stat"><b id="lStreak">0</b><span>連続日数</span></div>
    <div class="stat"><b id="lDays">0</b><span>学習日</span></div>
    <div class="stat"><b id="lTotal">0</b><span>累計回答</span></div>
  </div>
  <div class="card">
    <div class="calnav"><button class="iconbtn" id="cPrev">‹</button><b id="cTitle"></b><button class="iconbtn" id="cNext">›</button></div>
    <div class="cal" id="cal"></div>
    <div class="small" id="cDetail" style="margin-top:10px;min-height:20px"></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="muted">単語の覚え具合</div>
    <div class="levels" id="lvW"></div>
    <div class="muted" style="margin-top:10px">顔の覚え具合</div>
    <div class="levels" id="lvP"></div>
    <div class="small">左ほど新しい・右ほど定着（間隔 1→3→7→14→30→60日）</div>
  </div>
</section>

<!-- 設定 -->
<section class="screen" id="sSet">
  <h1>設定</h1>
  <div class="set"><label>1日の単語数</label><input type="range" id="stWordGoal" min="50" max="400" step="10"><span class="v" id="vWordGoal"></span></div>
  <div class="set"><label>1日の人数</label><input type="range" id="stFaceGoal" min="10" max="100" step="5"><span class="v" id="vFaceGoal"></span></div>
  <div class="set"><label>復習の上限</label><input type="range" id="stRatio" min="30" max="80" step="5"><span class="v" id="vRatio"></span></div>
  <div class="small" style="padding:6px 0 4px">復習ばかりで埋まらないよう、残りは必ず新しい単語にします。</div>
  <div class="set"><label>効果音</label><input type="range" id="stEff" min="0" max="100" step="5"><span class="v" id="vEff"></span><button class="test" id="tEff">試す</button></div>
  <div class="set"><label>発音の音量</label><input type="range" id="stSp" min="0" max="100" step="5"><span class="v" id="vSp"></span><button class="test" id="tSp">試す</button></div>
  <div class="set"><label>発音の速さ</label><input type="range" id="stRate" min="50" max="140" step="5"><span class="v" id="vRate"></span></div>
  <div class="set"><label>声</label><select id="stVoice"></select></div>
  <div class="set"><label>出題時に自動で発音</label><div class="sw" id="swAuto"></div></div>
  <div class="set"><label>答えで日本語も読む</label><div class="sw" id="swJa"></div></div>
  <div class="set"><label>名前を読み上げる</label><div class="sw" id="swName"></div></div>
  <div class="small" style="padding:16px 0" id="stStore"></div>
</section>

<!-- プレイ -->
<section class="screen" id="play">
  <div class="top">
    <button class="iconbtn" id="xClose" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="bar"><i id="pbar"></i></div>
    <div id="count">0/200</div>
    <button class="iconbtn" id="xUndo" aria-label="ひとつ戻す" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
  </div>
  <div id="stage">
    <div class="tag" id="tag">NEW</div>
    <img id="photo" alt="">
    <div id="front"></div>
    <div id="back"></div>
    <div id="hint">タップで答え</div>
  </div>
  <div id="combo"></div>
  <div class="answer wait" id="ans">
    <button id="bNg">✕ まだ</button>
    <button id="bOk">○ 覚えた</button>
  </div>
</section>

<section class="screen" id="sDone">
  <div class="done">
    <div style="font-size:64px">✓</div>
    <div class="big" style="font-size:36px;margin:12px 0" id="dTitle">今日はクリア</div>
    <div class="muted" id="dSub"></div>
    <div style="margin-top:32px"><button class="btn" id="dMore">＋100語</button>
    <button class="btn ghost" id="dHome" style="margin-top:10px">ホームへ</button></div>
  </div>
</section>

<nav id="nav">
  <button data-t="sWords" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>単語</button>
  <button data-t="sFaces"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>クリエイティブ</button>
  <button data-t="sLog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>記録</button>
  <button data-t="sSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>設定</button>
</nav>
<div id="toast"></div>

<script src="words.js"></script>
<script src="people.js"></script>
<script>
'use strict';
// =========================================================
// 記憶の仕組み（間隔反復）
//   新出で○ → 3日後 / ✕ → 翌日＋今日もう一度
//   復習で○ → 次の段（1→3→7→14→30→60日）/ ✕ → 翌日に戻す
// =========================================================
const INT = [0, 1, 3, 7, 14, 30, 60];
const GROUPS = { idea: 'アイデアの学校 講師', peer: 'アイデアの学校 同期', toraA: '虎ノ門広告祭 必修', toraB: '虎ノ門広告祭 その他' };
const LS = 'tdm2';
const W = window.WORDS, P = window.PEOPLE;
const pById = Object.fromEntries(P.map(p => [p.id, p]));
const wByEn = Object.fromEntries(W.map(w => [w.en, w]));

function dayNum(d = new Date()) { return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function dayStr(n = dayNum()) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pgroup(p) { return p.g === 'tora' ? 'tora' + p.tier : p.g; }

// =========================================================
// 保存（localStorage ＋ IndexedDB の二重化・1問ごとに即保存）
// =========================================================
const DEF_SETTINGS = { wordGoal: 200, wordExtra: 100, faceGoal: 40, faceExtra: 20, ratio: 60, eff: 70, sp: 90, rate: 90, voice: '', auto: true, ja: false, name: false, groups: { idea: true, peer: true, toraA: true, toraB: false } };
let S;
function fresh() {
  return { v: 2, updatedAt: 0, cards: {}, days: {}, today: {}, order: shuffle(W.map(w => w.en)), settings: structuredClone(DEF_SETTINGS) };
}
const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('tdm', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  get() {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction('kv').objectStore('kv').get(LS); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
      catch { res(null); }
    });
  },
  put(v) { try { this.db && this.db.transaction('kv', 'readwrite').objectStore('kv').put(v, LS); } catch {} },
};
let idbTimer = null;
function save() {
  S.updatedAt = Date.now();
  const json = JSON.stringify(S);
  try { localStorage.setItem(LS, json); } catch {}
  clearTimeout(idbTimer);
  idbTimer = setTimeout(() => IDB.put(json), 200);
}
function loadLocal() {
  try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; }
}
function normalize(s) {
  const f = fresh();
  s = Object.assign(f, s);
  s.settings = Object.assign(structuredClone(DEF_SETTINGS), s.settings || {});
  s.settings.groups = Object.assign(structuredClone(DEF_SETTINGS.groups), (s.settings.groups) || {});
  // 新しい単語が増えた場合に備えて出題順へ追加
  const known = new Set(s.order); W.forEach(w => { if (!known.has(w.en)) s.order.push(w.en); });
  return s;
}
// 旧版（v1）の記録を引き継ぐ
function migrateV1(s) {
  try {
    const hist = JSON.parse(localStorage.getItem('tdm-history-v1') || '{}');
    for (const [d, h] of Object.entries(hist)) {
      if (!s.days[d]) s.days[d] = { w: h.solved || 0, wc: h.solved || 0, p: 0, pc: 0, goalW: true, old: true };
    }
    const wrong = JSON.parse(localStorage.getItem('tdm-wrong-v1') || '[]');
    wrong.forEach(w => { const k = 'w:' + w.en; if (wByEn[w.en] && !s.cards[k]) s.cards[k] = { b: 1, d: dayNum(), n: 1, w: 1 }; });
    const st = JSON.parse(localStorage.getItem('tdm-settings-v1') || '{}');
    if (st.effectVolume != null) s.settings.eff = Math.round(st.effectVolume * 100);
    if (st.speechVolume != null) s.settings.sp = Math.round(st.speechVolume * 100);
  } catch {}
  s.migrated = true;
  return s;
}

// =========================================================
// 今日の出題を組む
// =========================================================
function deckKeys(type) {
  if (type === 'w') return S.order.map(en => 'w:' + en);
  const g = S.settings.groups;
  const rank = { toraA: 0, idea: 1, peer: 2, toraB: 3 }; // 広告祭(10/9〜)が近いので必修を先に
  return P.filter(p => g[pgroup(p)]).sort((a, b) => rank[pgroup(a)] - rank[pgroup(b)] || b.pri - a.pri).map(p => 'p:' + p.id);
}
function counts(type) {
  const today = dayNum(); let learned = 0, dueTomorrow = 0, unseen = 0;
  for (const k of deckKeys(type)) {
    const c = S.cards[k];
    if (!c) { unseen++; continue; }
    if (c.b >= 3) learned++;
    if (c.d <= today + 1) dueTomorrow++;
  }
  return { learned, dueTomorrow, unseen };
}
function build(type, n, exclude) {
  const today = dayNum();
  const keys = deckKeys(type).filter(k => !exclude.has(k));
  const due = [], fresh = [];
  for (const k of keys) {
    const c = S.cards[k];
    if (!c) fresh.push(k); else if (c.d <= today) due.push(k);
  }
  due.sort((a, b) => S.cards[a].d - S.cards[b].d || S.cards[a].b - S.cards[b].b);
  const maxRev = Math.round(n * S.settings.ratio / 100);
  let rev = due.slice(0, maxRev);
  let nw = fresh.slice(0, n - rev.length);
  if (rev.length + nw.length < n) rev = due.slice(0, n - nw.length); // 新出が尽きたら復習で埋める
  if (rev.length + nw.length < n) { // それでも足りなければ先取り復習
    const ahead = keys.filter(k => S.cards[k] && S.cards[k].d > today).sort((a, b) => S.cards[a].d - S.cards[b].d);
    rev = rev.concat(ahead.slice(0, n - rev.length - nw.length));
  }
  // 最初の数問は新出から始めて気持ちよく入る
  const mixed = shuffle(rev.concat(nw));
  const head = mixed.filter(k => !S.cards[k]).slice(0, 3);
  return { list: head.concat(mixed.filter(k => !head.includes(k))), rev: rev.length, nw: nw.length };
}
function getToday(type) {
  const ds = dayStr();
  if (!S.today || S.today.date !== ds) S.today = { date: ds };
  if (!S.today[type]) {
    const goal = type === 'w' ? S.settings.wordGoal : S.settings.faceGoal;
    const b = build(type, goal, new Set());
    S.today[type] = { q: b.list, pos: 0, goal, base: b.list.length, rev: b.rev, nw: b.nw, extra: 0 };
    save();
  }
  return S.today[type];
}
function addExtra(type) {
  const t = getToday(type);
  const n = type === 'w' ? S.settings.wordExtra : S.settings.faceExtra;
  const used = new Set(t.q.map(k => k.replace(/^!/, '')));
  const b = build(type, n, used);
  t.q = t.q.concat(b.list); t.goal += b.list.length; t.extra += b.list.length;
  save();
}
function doneCount(t) { return t.q.slice(0, t.pos).filter(k => k[0] !== '!').length; }
function dayLog() {
  const ds = dayStr();
  return S.days[ds] || (S.days[ds] = { w: 0, wc: 0, p: 0, pc: 0 });
}

// =========================================================
// 音
// =========================================================
const Sound = {
  ctx: null, voices: [],
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(seq, type) {
    const vol = S.settings.eff / 100; if (!this.ctx || vol <= 0) return;
    let t = this.ctx.currentTime;
    for (const [f, dur] of seq) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3 * vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
      t += dur * 0.85;
    }
  },
  ok() { this.tone([[880, 0.12], [1320, 0.22]], 'sine'); },
  ng() { this.tone([[180, 0.18], [150, 0.3]], 'square'); },
  loadVoices() {
    if (!('speechSynthesis' in window)) return;
    this.voices = speechSynthesis.getVoices();
    renderVoices();
  },
  pickVoice(lang) {
    const vs = this.voices;
    if (lang === 'en' && S.settings.voice) { const v = vs.find(v => v.voiceURI === S.settings.voice); if (v) return v; }
    const cand = vs.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
    return cand.find(v => /Samantha|Google US|Ava|Allison|Kyoko|O-Ren/.test(v.name)) || cand[0] || null;
  },
  say(text, lang = 'en') {
    if (!('speechSynthesis' in window) || S.settings.sp <= 0) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'ja-JP';
      const v = this.pickVoice(lang); if (v) u.voice = v;
      u.volume = S.settings.sp / 100;
      u.rate = (S.settings.rate / 100) * (lang === 'ja' ? 1.1 : 1);
      speechSynthesis.speak(u);
    } catch {}
  },
};

// =========================================================
// 画面
// =========================================================
const $ = id => document.getElementById(id);
let tab = 'sWords';
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.toggle('playing', id === 'play' || id === 'sDone');
  if (['sWords', 'sFaces', 'sLog', 'sSet'].includes(id)) {
    tab = id; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  }
  if (id === 'sWords') renderHome('w');
  if (id === 'sFaces') renderHome('p');
  if (id === 'sLog') renderLog();
  if (id === 'sSet') renderSettings();
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); }
function ring(el, v) { el.style.strokeDashoffset = 553 * (1 - Math.max(0, Math.min(1, v))); }

function renderHome(type) {
  const t = getToday(type), done = doneCount(t), unit = type === 'w' ? '語' : '人';
  const pre = type === 'w' ? 'w' : 'p';
  $(pre + 'Done').textContent = done;
  $(pre + 'Of').textContent = `/ ${t.goal} ${unit}`;
  ring($(pre + 'Ring'), done / Math.max(1, t.goal));
  $(pre + 'Ring').style.stroke = done >= t.base ? 'var(--gold)' : 'var(--ink)';
  $(pre + 'Mix').textContent = `今日の内訳：新しい ${t.nw} ／ 復習 ${t.rev}` + (t.extra ? ` ／ 追加 ${t.extra}` : '');
  const fin = t.pos >= t.q.length;
  $(pre + 'Start').textContent = fin ? '今日はクリア ✓' : done > 0 ? `続きから（あと ${t.goal - done}）` : 'スタート';
  $(pre + 'Start').disabled = fin;
  $(pre + 'More').style.display = fin ? 'block' : 'none';
  $(pre + 'More').textContent = `＋${type === 'w' ? S.settings.wordExtra + '語' : S.settings.faceExtra + '人'}`;
  const c = counts(type);
  $(pre + 'Learned').textContent = c.learned; $(pre + 'Due').textContent = c.dueTomorrow; $(pre + 'New').textContent = c.unseen;
  if (type === 'p') renderChips();
}
function renderChips() {
  const box = $('gChips'); box.innerHTML = '';
  const n = {}; P.forEach(p => { const g = pgroup(p); n[g] = (n[g] || 0) + 1; });
  for (const [g, label] of Object.entries(GROUPS)) {
    const b = document.createElement('button');
    b.className = 'chip' + (S.settings.groups[g] ? ' on' : '');
    b.textContent = `${label} ${n[g] || 0}`;
    b.onclick = () => {
      S.settings.groups[g] = !S.settings.groups[g];
      if (!Object.values(S.settings.groups).some(Boolean)) S.settings.groups[g] = true;
      // まだ1問も解いていなければ今日の出題を組み直す
      const t = S.today.p; if (t && t.pos === 0) delete S.today.p;
      save(); renderHome('p');
      if (t && t.pos > 0) toast('明日の出題から反映します');
    };
    box.appendChild(b);
  }
}

// =========================================================
// プレイ
// =========================================================
let G = null; // {type, revealed, combo, undo:[]}
function start(type) {
  Sound.init();
  const t = getToday(type);
  if (t.pos >= t.q.length) return;
  G = { type, revealed: false, combo: 0, undo: [] };
  show('play');
  load();
}
function curKey() { const t = S.today[G.type]; return t.q[t.pos]; }
function load() {
  const t = S.today[G.type];
  if (t.pos >= t.q.length) return finish();
  const raw = curKey(), again = raw[0] === '!', key = raw.replace(/^!/, '');
  const c = S.cards[key];
  G.revealed = false;
  const tag = $('tag');
  if (again) { tag.textContent = 'もう一度'; tag.className = 'tag again'; }
  else if (!c) { tag.textContent = 'NEW'; tag.className = 'tag new'; }
  else { tag.textContent = '復習'; tag.className = 'tag rev'; }
  const back = $('back'); back.classList.remove('show'); back.innerHTML = '';
  if (G.type === 'w') {
    const w = wByEn[key.slice(2)];
    $('photo').style.display = 'none'; $('front').style.display = 'block';
    $('front').textContent = w.en;
    $('front').style.fontSize = w.en.length > 14 ? '32px' : '44px';
    if (S.settings.auto) Sound.say(w.en);
  } else {
    const p = pById[key.slice(2)];
    $('front').style.display = 'none';
    const img = $('photo'); img.style.display = 'block'; img.src = p.img;
    // 次の顔を先読み
    const nk = t.q[t.pos + 1]; if (nk) { const np = pById[nk.replace(/^!/, '').slice(2)]; if (np) new Image().src = np.img; }
  }
  $('hint').style.visibility = 'visible';
  $('ans').classList.add('wait');
  const done = doneCount(t);
  $('count').textContent = `${done}/${t.goal}`;
  $('pbar').style.width = (done / Math.max(1, t.goal) * 100) + '%';
  $('xUndo').disabled = G.undo.length === 0;
  $('combo').textContent = G.combo >= 5 ? `${G.combo} COMBO` : '';
}
function reveal() {
  if (!G || G.revealed) return;
  G.revealed = true;
  const key = curKey().replace(/^!/, '');
  const back = $('back');
  if (G.type === 'w') {
    const w = wByEn[key.slice(2)];
    back.innerHTML = `<div class="jp"></div>`; back.querySelector('.jp').textContent = w.jp;
    if (S.settings.ja) Sound.say(w.jp.split(/[、,]/)[0], 'ja');
  } else {
    const p = pById[key.slice(2)];
    back.innerHTML = `<div class="jp"></div><div class="kana"></div><div class="sub"></div><div class="ses"></div>`;
    back.querySelector('.jp').textContent = p.name;
    back.querySelector('.kana').textContent = p.kana;
    back.querySelector('.sub').textContent = p.sub;
    back.querySelector('.ses').textContent = p.ses && p.ses.length ? '登壇：' + p.ses.join(' ／ ') : '';
    if (S.settings.name) Sound.say(p.kana || p.name, 'ja');
  }
  back.classList.add('show');
  $('hint').style.visibility = 'hidden';
  $('ans').classList.remove('wait');
}
function grade(ok) {
  if (!G || !G.revealed) return;
  const t = S.today[G.type], raw = curKey(), again = raw[0] === '!', key = raw.replace(/^!/, '');
  const log = dayLog();
  G.undo.push(JSON.stringify({ card: S.cards[key] || null, key, q: t.q, pos: t.pos, log, combo: G.combo }));
  if (G.undo.length > 5) G.undo.shift();
  const today = dayNum();
  if (!again) {
    const c = S.cards[key] || { b: 0, n: 0, w: 0 };
    const isNew = c.n === 0;
    c.n++;
    if (ok) c.b = isNew ? 2 : Math.min(c.b + 1, INT.length - 1);
    else { c.b = 1; c.w++; }
    c.d = today + INT[c.b]; c.l = today;
    S.cards[key] = c;
    const f = G.type === 'w' ? ['w', 'wc'] : ['p', 'pc'];
    log[f[0]]++; if (ok) log[f[1]]++;
  }
  if (!ok && !again) { // 今日のうちにもう一度（8問後）
    t.q = t.q.slice(); t.q.splice(Math.min(t.pos + 8, t.q.length), 0, '!' + key);
  }
  t.pos++;
  if (doneCount(t) >= t.base) log[G.type === 'w' ? 'goalW' : 'goalP'] = true;
  G.combo = ok ? G.combo + 1 : 0;
  ok ? Sound.ok() : Sound.ng();
  save();
  load();
}
function undo() {
  if (!G || !G.undo.length) return;
  const u = JSON.parse(G.undo.pop());
  if (u.card) S.cards[u.key] = u.card; else delete S.cards[u.key];
  const t = S.today[G.type]; t.q = u.q; t.pos = u.pos;
  S.days[dayStr()] = u.log; G.combo = u.combo;
  save(); load();
}
function finish() {
  const type = G.type, t = S.today[type];
  $('dTitle').textContent = type === 'w' ? `${doneCount(t)}語 クリア` : `${doneCount(t)}人 クリア`;
  const c = counts(type);
  $('dSub').textContent = `定着 ${c.learned} ／ 明日の復習 ${c.dueTomorrow}`;
  $('dMore').textContent = `＋${type === 'w' ? S.settings.wordExtra + '語' : S.settings.faceExtra + '人'}`;
  $('dMore').onclick = () => { addExtra(type); start(type); };
  show('sDone');
}
function closePlay() { const type = G ? G.type : 'w'; G = null; try { speechSynthesis.cancel(); } catch {} show(type === 'w' ? 'sWords' : 'sFaces'); }

// =========================================================
// 記録
// =========================================================
let cal = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
function streak() {
  let n = 0, d = dayNum();
  const act = ds => { const x = S.days[ds]; return x && (x.w + x.p) > 0; };
  if (!act(dayStr(d))) d--;
  while (act(dayStr(d))) { n++; d--; }
  return n;
}
function renderLog() {
  const days = Object.entries(S.days).filter(([, x]) => (x.w + x.p) > 0);
  $('lStreak').textContent = streak();
  $('lDays').textContent = days.length;
  $('lTotal').textContent = days.reduce((s, [, x]) => s + x.w + x.p, 0);
  $('cTitle').textContent = `${cal.y}年 ${cal.m + 1}月`;
  const g = $('cal'); g.innerHTML = '';
  '日月火水木金土'.split('').forEach(h => { const e = document.createElement('div'); e.className = 'h'; e.textContent = h; g.appendChild(e); });
  const first = new Date(cal.y, cal.m, 1).getDay(), last = new Date(cal.y, cal.m + 1, 0).getDate(), td = dayStr();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('div'));
  for (let d = 1; d <= last; d++) {
    const ds = `${cal.y}-${String(cal.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const x = S.days[ds], e = document.createElement('div');
    e.className = 'd' + (x && x.w + x.p > 0 ? ' has' : '') + (x && x.goalW ? ' goal' : '') + (ds === td ? ' today' : '');
    e.innerHTML = `<span>${d}</span>` + (x && x.w + x.p > 0 ? `<small>${x.w || ''}</small>` : '');
    e.onclick = () => {
      if (!x || x.w + x.p === 0) { $('cDetail').textContent = `${ds}　記録なし`; return; }
      const r = (a, b) => a ? Math.round(b / a * 100) + '%' : '-';
      $('cDetail').textContent = `${ds}　単語 ${x.w}（正答 ${r(x.w, x.wc)}）　顔 ${x.p}（正答 ${r(x.p, x.pc)}）` + (x.old ? '　※旧版の記録' : '');
    };
    g.appendChild(e);
  }
  levels('w', $('lvW')); levels('p', $('lvP'));
}
function levels(type, el) {
  const keys = type === 'w' ? W.map(w => 'w:' + w.en) : P.map(p => 'p:' + p.id);
  const n = new Array(INT.length + 1).fill(0);
  keys.forEach(k => { const c = S.cards[k]; n[c ? c.b + 1 : 0]++; });
  const col = ['#262931', '#ff5d5d', '#ff9f43', '#f5c542', '#a3d977', '#3ecf8e', '#2bb3a3', '#7aa2ff'];
  el.innerHTML = n.map((v, i) => `<i style="width:${v / keys.length * 100}%;background:${col[i]}"></i>`).join('');
}

// =========================================================
// 設定
// =========================================================
function renderVoices() {
  const sel = $('stVoice'); if (!sel || !S) return;
  const en = Sound.voices.filter(v => /^en/i.test(v.lang));
  sel.innerHTML = '<option value="">自動</option>' + en.map(v => `<option value="${v.voiceURI.replace(/"/g, '&quot;')}">${v.name} (${v.lang})</option>`).join('');
  sel.value = S.settings.voice || '';
}
function renderSettings() {
  const s = S.settings;
  const bind = (id, key, fmt) => {
    const el = $('st' + id), v = $('v' + id);
    el.value = s[key]; v.textContent = fmt(s[key]);
    el.oninput = () => { s[key] = +el.value; v.textContent = fmt(s[key]); save(); };
  };
  bind('WordGoal', 'wordGoal', x => x + '語');
  bind('FaceGoal', 'faceGoal', x => x + '人');
  bind('Ratio', 'ratio', x => x + '%');
  bind('Eff', 'eff', x => x);
  bind('Sp', 'sp', x => x);
  bind('Rate', 'rate', x => (x / 100).toFixed(2) + '×');
  const sw = (id, key) => { const e = $(id); e.classList.toggle('on', !!s[key]); e.onclick = () => { s[key] = !s[key]; e.classList.toggle('on', s[key]); save(); }; };
  sw('swAuto', 'auto'); sw('swJa', 'ja'); sw('swName', 'name');
  renderVoices();
  $('stVoice').onchange = e => { s.voice = e.target.value; save(); Sound.say('available'); };
  storeInfo();
}
async function storeInfo() {
  let persisted = false;
  try { persisted = navigator.storage && await navigator.storage.persisted(); } catch {}
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('stStore').innerHTML = `記録はこの端末に二重で保存しています（1問ごと）。永続化：${persisted ? 'ON' : 'OFF'}` +
    (standalone ? '' : '<br>iPhoneは Safari の共有→「ホーム画面に追加」から開くと、記録が自動で消されなくなります。') +
    '<br>1日の目標を変えた場合は翌日の出題から反映されます。';
}

// =========================================================
// 起動
// =========================================================
async function boot() {
  const local = loadLocal();
  await IDB.open();
  let fromIdb = null;
  try { const v = await IDB.get(); fromIdb = v ? JSON.parse(v) : null; } catch {}
  // 新しい方を採用（どちらかが消されても、もう片方から戻る）
  const pick = (fromIdb && (!local || (fromIdb.updatedAt || 0) > (local.updatedAt || 0))) ? fromIdb : local;
  S = normalize(pick || {});
  if (!S.migrated) migrateV1(S);
  save();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  show(tab);
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
$('wStart').onclick = () => start('w');
$('pStart').onclick = () => start('p');
$('wMore').onclick = () => { addExtra('w'); start('w'); };
$('pMore').onclick = () => { addExtra('p'); start('p'); };
$('dHome').onclick = closePlay;
$('xClose').onclick = closePlay;
$('xUndo').onclick = undo;
$('stage').onclick = () => {
  if (!G) return;
  if (!G.revealed) reveal();
  else if (G.type === 'w') Sound.say(wByEn[curKey().replace(/^!/, '').slice(2)].en);
};
$('bOk').onclick = () => grade(true);
$('bNg').onclick = () => grade(false);
$('cPrev').onclick = () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } renderLog(); };
$('cNext').onclick = () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } renderLog(); };
$('tEff').onclick = () => { Sound.init(); Sound.ok(); setTimeout(() => Sound.ng(), 450); };
$('tSp').onclick = () => Sound.say('Thank you for your patience.');
document.addEventListener('keydown', e => {
  if (!G || !document.getElementById('play').classList.contains('on')) return;
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); G.revealed ? null : reveal(); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { G.revealed ? grade(true) : reveal(); }
  else if (e.key === 'Shift' || e.key === 'ArrowLeft') { if (G.revealed) grade(false); }
  else if (e.key === 'Backspace' || (e.key === 'z' && (e.metaKey || e.ctrlKey))) undo();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S) IDB.put(JSON.stringify(S)); });
// 日付をまたいだら今日の出題を作り直す
setInterval(() => { if (S && S.today && S.today.date !== dayStr() && !G) show(tab); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot().then(() => {
  if ('speechSynthesis' in window) { Sound.loadVoices(); speechSynthesis.onvoiceschanged = () => Sound.loadVoices(); }
});
window.__app = { get S() { return S; }, start, reveal, grade, undo, doneCount, dayStr, show };
