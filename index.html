<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Master">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<title>Daily Master</title>
<style>
:root{
  --green:#58cc02; --green-d:#58a700; --green-l:#d7ffb8;
  --blue:#1cb0f6;  --blue-d:#1899d6;  --blue-l:#ddf4ff;
  --red:#ff4b4b;   --red-d:#ea2b2b;   --red-l:#ffdfe0;
  --gold:#ffc800;  --gold-d:#e5a500;  --orange:#ff9600;
  --purple:#ce82ff;--purple-d:#a568cc;--purple-l:#f4e3ff;
  --ink:#3c3c3c; --sub:#777; --dim:#afafaf; --line:#e5e5e5; --bg:#fff; --soft:#f7f7f7;
  --c:var(--green); --cd:var(--green-d); --cl:var(--green-l);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:"Nunito","M PLUS Rounded 1c",-apple-system,"Hiragino Maru Gothic ProN",sans-serif;font-weight:800}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.jp{font-family:"M PLUS Rounded 1c","Nunito",sans-serif}
.screen{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:calc(var(--safe-t) + 12px) 16px 20px;min-height:0}
.screen.on{display:flex;animation:screenIn .35s var(--spring)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#sFaces{--c:var(--purple);--cd:var(--purple-d);--cl:var(--purple-l)}

/* ---------- 3D ボタン ---------- */
.b3{position:relative;display:block;width:100%;padding:15px 16px;border-radius:16px;font-size:17px;font-weight:900;letter-spacing:.06em;
  background:var(--c);color:#fff;box-shadow:0 5px 0 var(--cd);transition:transform .08s,box-shadow .08s,filter .15s;text-transform:uppercase}
.b3:active,.b3.press{transform:translateY(5px);box-shadow:0 0 0 var(--cd)}
.b3:disabled{background:var(--line);box-shadow:0 5px 0 #cfcfcf;color:var(--dim)}
.b3.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.b3.blue{--c:var(--blue);--cd:var(--blue-d)}
.b3.red{--c:var(--red);--cd:var(--red-d)}
.b3.green{--c:var(--green);--cd:var(--green-d)}
.b3.shine::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:shine 2.6s infinite}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}

/* ---------- ヘッダー ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hud .pill{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:900}
.hud .pill.fire{color:var(--orange)} .hud .pill.bolt{color:var(--gold-d)} .hud .pill.gem{color:var(--blue)}
.hud .pill.off{color:var(--dim);filter:grayscale(1)}
.hud .ico{font-size:20px;display:inline-block}
.hud .pill.fire .ico{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}

/* ---------- マスコット ---------- */
.hero{display:flex;align-items:flex-end;gap:10px;margin:14px 0 10px}
.mascot{width:108px;height:108px;flex:none;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.mascot.jump{animation:jump .7s var(--spring) 3}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.02,.98)}}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.9)}40%{transform:translateY(-28px) scale(.95,1.06)}100%{transform:translateY(0) scale(1,1)}}
.mascot .eyes{animation:blink 4.2s infinite;transform-origin:60px 58px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .happy{display:none} .mascot.joy .happy{display:block} .mascot.joy .eyes{display:none}
.bubble{position:relative;flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.4;margin-bottom:30px;background:#fff;animation:pop .45s var(--spring)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- 今日の進み ---------- */
.today{border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.today .lbl{font-size:13px;color:var(--sub);letter-spacing:.08em}
.today .num{font-size:44px;font-weight:900;line-height:1.1;color:var(--c)}
.today .num small{font-size:18px;color:var(--dim)}
.prog{position:relative;height:18px;background:var(--line);border-radius:10px;overflow:hidden;margin:10px 0 8px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:10px;transition:width .6s var(--spring);min-width:18px}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.mix{display:flex;gap:6px;flex-wrap:wrap}
.tagp{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--sub)}
.tagp.n{background:var(--blue-l);color:var(--blue-d)} .tagp.r{background:#fff4d6;color:var(--gold-d)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:900}
.tile span{font-size:11px;color:var(--sub)}
.tile:nth-child(1) b{color:var(--green)} .tile:nth-child(2) b{color:var(--gold-d)} .tile:nth-child(3) b{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{padding:8px 12px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:13px;color:var(--sub);transition:transform .08s}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip.on{border-color:var(--c);color:var(--cd);background:var(--cl);box-shadow:0 3px 0 var(--c)}
h1{font-size:22px;font-weight:900;margin:6px 0 10px}

/* ---------- タブバー ---------- */
nav{display:flex;border-top:2px solid var(--line);background:#fff;padding:6px 8px calc(var(--safe-b) + 6px);gap:4px}
nav button{flex:1;padding:6px 0;border-radius:14px;border:2px solid transparent;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s var(--spring)}
nav button .e{font-size:24px;filter:grayscale(1) opacity(.55);transition:filter .2s,transform .3s var(--spring)}
nav button.on{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
nav button.on .e{filter:none;transform:scale(1.12)}
nav button:active{transform:scale(.9)}
body.playing nav{display:none}

/* ---------- プレイ ---------- */
#play{padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 16px);overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.iconbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-radius:10px}
.iconbtn:active{transform:scale(.85)}
.iconbtn:disabled{opacity:.3}
.pbar{flex:1;position:relative;height:18px;background:var(--line);border-radius:10px;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);border-radius:10px;transition:width .45s var(--spring);min-width:18px}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.pbar.hot i{background:linear-gradient(90deg,var(--orange),var(--gold))}
#count{font-size:14px;color:var(--dim);font-weight:900;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.sub-hud{display:flex;justify-content:space-between;align-items:center;height:34px;margin-top:8px}
.tag{font-size:12px;font-weight:900;letter-spacing:.1em;padding:4px 10px;border-radius:10px}
.tag.new{background:var(--blue-l);color:var(--blue-d)}
.tag.rev{background:#fff4d6;color:var(--gold-d)}
.tag.again{background:var(--red-l);color:var(--red-d)}
#combo{font-size:15px;font-weight:900;color:var(--orange);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
#combo.on{opacity:1;transform:scale(1)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;min-height:0;position:relative}
.card{position:relative;width:100%;max-width:400px;height:min(58vh,440px);touch-action:none;will-change:transform}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s var(--spring)}
.card.rev .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line);border-radius:24px;background:#fff;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;overflow:hidden}
.face.b{transform:rotateY(180deg)}
.card.enter{animation:cardIn .45s var(--spring)}
@keyframes cardIn{from{transform:scale(.82) translateY(24px);opacity:0}to{transform:none;opacity:1}}
.card.out-ok{transition:transform .32s ease-in,opacity .32s;transform:translateX(130%) rotate(18deg)!important;opacity:0}
.card.out-ng{transition:transform .32s ease-in,opacity .32s;transform:translateX(-130%) rotate(-18deg)!important;opacity:0}
.card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.stamp{position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:12px;font-size:22px;font-weight:900;opacity:0;z-index:3;pointer-events:none}
.stamp.ok{right:20px;color:var(--green);border-color:var(--green);transform:rotate(12deg)}
.stamp.ng{left:20px;color:var(--red);border-color:var(--red);transform:rotate(-12deg)}
.word{font-size:46px;font-weight:900;letter-spacing:-.01em;line-height:1.1;word-break:break-word;color:var(--ink)}
.speak{margin-top:22px;width:62px;height:62px;border-radius:18px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);display:flex;align-items:center;justify-content:center;color:#fff}
.speak:active{transform:translateY(5px);box-shadow:none}
.speak.talk svg{animation:talk .5s ease-in-out 2}
@keyframes talk{50%{transform:scale(1.2)}}
.photo{width:100%;height:100%;object-fit:cover;object-position:50% 22%;position:absolute;inset:0}
.hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:var(--dim);letter-spacing:.12em;animation:hint 1.8s ease-in-out infinite}
.face.a.ph .hint{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
@keyframes hint{50%{opacity:.4;transform:translateY(-3px)}}
.mean{font-size:27px;line-height:1.45;color:var(--ink)}
.small-en{font-size:16px;color:var(--dim);margin-bottom:10px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:4px solid var(--purple-l);margin-bottom:12px}
.pname{font-size:30px;line-height:1.25}
.pkana{font-size:14px;color:var(--sub);margin-top:4px}
.psub{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.55;font-weight:700}
.pses{font-size:12px;color:var(--purple-d);background:var(--purple-l);border-radius:12px;padding:8px 10px;margin-top:12px;line-height:1.5;font-weight:700}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;transition:opacity .2s,transform .3s var(--spring)}
.answer.wait{opacity:.0;transform:translateY(16px);pointer-events:none}
.answer .b3{font-size:19px;padding:17px 0}
.xp{position:absolute;font-size:24px;font-weight:900;color:var(--gold-d);pointer-events:none;z-index:20;animation:xp .9s ease-out forwards}
@keyframes xp{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
.praise{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 var(--orange),0 0 0 #000;
  background:var(--gold);padding:10px 22px;border-radius:20px;box-shadow:0 6px 0 var(--gold-d);z-index:30;pointer-events:none;animation:praise 1.1s var(--spring) forwards;white-space:nowrap}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}45%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- 完了 ---------- */
#sDone{align-items:center;justify-content:center;text-align:center}
#sDone .mascot{width:150px;height:150px}
.dtitle{font-size:30px;font-weight:900;color:var(--gold-d);margin:12px 0 4px;animation:pop .6s var(--spring)}
.dsub{font-size:15px;color:var(--sub)}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px;margin:24px 0}
.dstat{border:2px solid var(--k);border-radius:16px;overflow:hidden;opacity:0;transform:translateY(20px) scale(.9)}
.dstat.on{animation:statIn .5s var(--spring) forwards}
@keyframes statIn{to{opacity:1;transform:none}}
.dstat .h{background:var(--k);color:#fff;font-size:11px;padding:5px 0;letter-spacing:.08em}
.dstat .v{font-size:24px;font-weight:900;padding:12px 0;color:var(--k)}
.streakpop{font-size:18px;color:var(--orange);margin-bottom:16px;opacity:0}
.streakpop.on{animation:pop .5s var(--spring) forwards}
.dbtns{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}

/* ---------- 記録 ---------- */
.streakcard{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#ff9600,#ffc800);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 #e08600;margin-bottom:16px}
.streakcard .big{font-size:46px;font-weight:900;line-height:1}
.streakcard .fl{font-size:52px;animation:flick 1.6s ease-in-out infinite}
.box{border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--dim);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim);position:relative;transition:transform .15s var(--spring)}
.cal .d:active{transform:scale(.85)}
.cal .d.has{background:#fff4d6;color:var(--gold-d)}
.cal .d.goal{background:var(--orange);color:#fff;box-shadow:0 3px 0 #e08600}
.cal .d.today{outline:2px solid var(--blue);outline-offset:1px}
.cal .d.sel{transform:scale(1.12)}
#cDetail{font-size:13px;color:var(--sub);margin-top:10px;min-height:20px;font-weight:700}
.levels{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--line);margin:8px 0 12px}
.levels i{display:block;height:100%;transition:width .8s var(--spring)}
.lbl2{font-size:14px;color:var(--sub)}
.small{font-size:12px;color:var(--dim);line-height:1.6;font-weight:700}

/* ---------- 設定 ---------- */
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:2px solid var(--soft);gap:10px}
.set label{font-size:15px}
.set .v{font-size:14px;color:var(--blue);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.set input[type=range]{flex:1;max-width:44%;accent-color:var(--blue);height:28px}
.set select{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;max-width:55%;font:inherit;font-size:13px}
.sw{width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:left .25s var(--spring)}
.sw.on{background:var(--green)} .sw.on::after{left:25px}
.test{font-size:12px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;color:var(--blue);box-shadow:0 3px 0 var(--line)}
.test:active{transform:translateY(3px);box-shadow:none}
.sec{font-size:13px;color:var(--dim);letter-spacing:.1em;margin:18px 0 2px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:all .3s var(--spring);pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
#hap{position:fixed;left:-100px;top:-100px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<template id="mascotT">
<svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M60 22c2-9 9-14 17-13-1 8-7 14-17 13z" fill="#58a700"/>
  <path d="M60 22c-2-8-8-12-15-11 1 7 6 12 15 11z" fill="#89e219"/>
  <ellipse cx="60" cy="112" rx="34" ry="5" fill="#000" opacity=".08"/>
  <ellipse cx="44" cy="106" rx="11" ry="6" fill="#ff9600"/><ellipse cx="76" cy="106" rx="11" ry="6" fill="#ff9600"/>
  <ellipse cx="60" cy="68" rx="44" ry="41" fill="var(--c,#58cc02)"/>
  <ellipse cx="60" cy="82" rx="27" ry="21" fill="#fff" opacity=".35"/>
  <ellipse cx="22" cy="74" rx="9" ry="14" fill="var(--cd,#58a700)" transform="rotate(20 22 74)"/>
  <ellipse cx="98" cy="74" rx="9" ry="14" fill="var(--cd,#58a700)" transform="rotate(-20 98 74)"/>
  <g class="eyes">
    <circle cx="44" cy="58" r="14" fill="#fff"/><circle cx="76" cy="58" r="14" fill="#fff"/>
    <circle cx="47" cy="60" r="7" fill="#3c3c3c"/><circle cx="73" cy="60" r="7" fill="#3c3c3c"/>
    <circle cx="49" cy="57" r="2.4" fill="#fff"/><circle cx="75" cy="57" r="2.4" fill="#fff"/>
  </g>
  <g class="happy" fill="none" stroke="#3c3c3c" stroke-width="5" stroke-linecap="round">
    <path d="M34 60q10-12 20 0"/><path d="M66 60q10-12 20 0"/>
  </g>
  <path d="M53 74q7 7 14 0" fill="#ff9600"/>
  <circle cx="30" cy="74" r="5" fill="#ff86a0" opacity=".55"/><circle cx="90" cy="74" r="5" fill="#ff86a0" opacity=".55"/>
</svg>
</template>

<!-- 単語 -->
<section class="screen on" id="sWords">
  <div class="hud"><span class="pill fire" data-streak><span class="ico">🔥</span><b>0</b></span><span class="pill bolt" data-xp><span class="ico">⚡</span><b>0</b></span><span class="pill gem" data-gem="w"><span class="ico">💎</span><b>0</b></span></div>
  <div class="hero"><div class="m"></div><div class="bubble jp" id="wSay">今日もやろう！</div></div>
  <div class="today">
    <div class="lbl jp">今日の単語</div>
    <div class="num"><span id="wDone">0</span><small id="wOf"> / 200</small></div>
    <div class="prog"><i id="wBar"></i></div>
    <div class="mix jp" id="wMix"></div>
  </div>
  <button class="b3 shine" id="wStart">スタート</button>
  <button class="b3 blue" id="wMore" style="margin-top:14px;display:none">＋100語</button>
  <div class="tiles jp"><div class="tile"><b id="wLearned">0</b><span>定着</span></div><div class="tile"><b id="wDue">0</b><span>明日の復習</span></div><div class="tile"><b id="wNew">0</b><span>未出題</span></div></div>
</section>

<script>
'use strict';
// =========================================================
// 記憶の仕組み（間隔反復）
//   新出で○ → 3日後 / ✕ → 翌日＋今日もう一度
//   復習で○ → 次の段（1→3→7→14→30→60日）/ ✕ → 翌日に戻す
// =========================================================
const INT = [0, 1, 3, 7, 14, 30, 60];
const GROUPS = { idea: 'アイデアの学校 講師', peer: 'アイデアの学校 同期', toraA: '虎ノ門広告祭 必修', toraB: '虎ノ門広告祭 その他' };
const LS = 'tdm2';
const W = window.WORDS, P = window.PEOPLE;
const pById = Object.fromEntries(P.map(p => [p.id, p]));
const wByEn = Object.fromEntries(W.map(w => [w.en, w]));

function dayNum(d = new Date()) { return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function dayStr(n = dayNum()) { return new Date(n * 86400000).toISOString().slice(0, 10); }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pgroup(p) { return p.g === 'tora' ? 'tora' + p.tier : p.g; }

// =========================================================
// 保存（localStorage ＋ IndexedDB の二重化・1問ごとに即保存）
// =========================================================
const DEF_SETTINGS = { wordGoal: 200, wordExtra: 100, faceGoal: 40, faceExtra: 20, ratio: 60, eff: 70, sp: 90, rate: 90, voice: '', auto: true, hap: true, ja: false, name: false, groups: { idea: true, peer: true, toraA: true, toraB: false } };
let S;
function fresh() {
  return { v: 2, updatedAt: 0, cards: {}, days: {}, today: {}, order: shuffle(W.map(w => w.en)), settings: structuredClone(DEF_SETTINGS) };
}
const IDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('tdm', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },
  get() {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction('kv').objectStore('kv').get(LS); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
      catch { res(null); }
    });
  },
  put(v) { try { this.db && this.db.transaction('kv', 'readwrite').objectStore('kv').put(v, LS); } catch {} },
};
let idbTimer = null;
function save() {
  S.updatedAt = Date.now();
  const json = JSON.stringify(S);
  try { localStorage.setItem(LS, json); } catch {}
  clearTimeout(idbTimer);
  idbTimer = setTimeout(() => IDB.put(json), 200);
}
function loadLocal() {
  try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; }
}
function normalize(s) {
  const f = fresh();
  s = Object.assign(f, s);
  s.settings = Object.assign(structuredClone(DEF_SETTINGS), s.settings || {});
  s.settings.groups = Object.assign(structuredClone(DEF_SETTINGS.groups), (s.settings.groups) || {});
  // 新しい単語が増えた場合に備えて出題順へ追加
  const known = new Set(s.order); W.forEach(w => { if (!known.has(w.en)) s.order.push(w.en); });
  return s;
}
// 旧版（v1）の記録を引き継ぐ
function migrateV1(s) {
  try {
    const hist = JSON.parse(localStorage.getItem('tdm-history-v1') || '{}');
    for (const [d, h] of Object.entries(hist)) {
      if (!s.days[d]) s.days[d] = { w: h.solved || 0, wc: h.solved || 0, p: 0, pc: 0, goalW: true, old: true };
    }
    const wrong = JSON.parse(localStorage.getItem('tdm-wrong-v1') || '[]');
    wrong.forEach(w => { const k = 'w:' + w.en; if (wByEn[w.en] && !s.cards[k]) s.cards[k] = { b: 1, d: dayNum(), n: 1, w: 1 }; });
    const st = JSON.parse(localStorage.getItem('tdm-settings-v1') || '{}');
    if (st.effectVolume != null) s.settings.eff = Math.round(st.effectVolume * 100);
    if (st.speechVolume != null) s.settings.sp = Math.round(st.speechVolume * 100);
  } catch {}
  s.migrated = true;
  return s;
}

// =========================================================
// 今日の出題を組む
// =========================================================
function deckKeys(type) {
  if (type === 'w') return S.order.map(en => 'w:' + en);
  const g = S.settings.groups;
  const rank = { toraA: 0, idea: 1, peer: 2, toraB: 3 }; // 広告祭(10/9〜)が近いので必修を先に
  return P.filter(p => g[pgroup(p)]).sort((a, b) => rank[pgroup(a)] - rank[pgroup(b)] || b.pri - a.pri).map(p => 'p:' + p.id);
}
function counts(type) {
  const today = dayNum(); let learned = 0, dueTomorrow = 0, unseen = 0;
  for (const k of deckKeys(type)) {
    const c = S.cards[k];
    if (!c) { unseen++; continue; }
    if (c.b >= 3) learned++;
    if (c.d <= today + 1) dueTomorrow++;
  }
  return { learned, dueTomorrow, unseen };
}
function build(type, n, exclude) {
  const today = dayNum();
  const keys = deckKeys(type).filter(k => !exclude.has(k));
  const due = [], fresh = [];
  for (const k of keys) {
    const c = S.cards[k];
    if (!c) fresh.push(k); else if (c.d <= today) due.push(k);
  }
  due.sort((a, b) => S.cards[a].d - S.cards[b].d || S.cards[a].b - S.cards[b].b);
  const maxRev = Math.round(n * S.settings.ratio / 100);
  let rev = due.slice(0, maxRev);
  let nw = fresh.slice(0, n - rev.length);
  if (rev.length + nw.length < n) rev = due.slice(0, n - nw.length); // 新出が尽きたら復習で埋める
  if (rev.length + nw.length < n) { // それでも足りなければ先取り復習
    const ahead = keys.filter(k => S.cards[k] && S.cards[k].d > today).sort((a, b) => S.cards[a].d - S.cards[b].d);
    rev = rev.concat(ahead.slice(0, n - rev.length - nw.length));
  }
  // 最初の数問は新出から始めて気持ちよく入る
  const mixed = shuffle(rev.concat(nw));
  const head = mixed.filter(k => !S.cards[k]).slice(0, 3);
  return { list: head.concat(mixed.filter(k => !head.includes(k))), rev: rev.length, nw: nw.length };
}
function getToday(type) {
  const ds = dayStr();
  if (!S.today || S.today.date !== ds) S.today = { date: ds };
  if (!S.today[type]) {
    const goal = type === 'w' ? S.settings.wordGoal : S.settings.faceGoal;
    const b = build(type, goal, new Set());
    S.today[type] = { q: b.list, pos: 0, goal, base: b.list.length, rev: b.rev, nw: b.nw, extra: 0 };
    save();
  }
  return S.today[type];
}
function addExtra(type) {
  const t = getToday(type);
  const n = type === 'w' ? S.settings.wordExtra : S.settings.faceExtra;
  const used = new Set(t.q.map(k => k.replace(/^!/, '')));
  const b = build(type, n, used);
  t.q = t.q.concat(b.list); t.goal += b.list.length; t.extra += b.list.length;
  save();
}
function doneCount(t) { return t.q.slice(0, t.pos).filter(k => k[0] !== '!').length; }
function dayLog() {
  const ds = dayStr();
  return S.days[ds] || (S.days[ds] = { w: 0, wc: 0, p: 0, pc: 0 });
}


// =========================================================
// 振動（Android＝vibrate／iPhone＝Safari 18 のスイッチ触覚）
// =========================================================
const Haptic = {
  lab: null,
  one() {
    if (!S || !S.settings.hap) return;
    if (navigator.vibrate) { navigator.vibrate(12); return; }
    try { (this.lab || (this.lab = document.getElementById('hap'))).click(); } catch {}
  },
  pattern(ms) { // ms: 振動の間隔の配列
    if (!S || !S.settings.hap) return;
    if (navigator.vibrate) { navigator.vibrate(ms.flatMap(t => [18, t])); return; }
    this.one(); let t = 0; ms.forEach(d => { t += d; setTimeout(() => this.one(), t); });
  },
  tap() { this.one(); },
  ok() { this.pattern([70]); },
  ng() { this.pattern([60, 60]); },
  big() { this.pattern([90, 90, 90, 160, 70]); },
};

// =========================================================
// 音
// =========================================================
const Sound = {
  ctx: null, voices: [],
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  note(f, at, dur, type = 'sine', gain = 0.28) {
    const vol = S.settings.eff / 100; if (!this.ctx || vol <= 0) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain * vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);
  },
  ok(combo = 0) { const k = Math.pow(2, Math.min(combo, 12) / 24); this.note(784 * k, 0, .12, 'triangle'); this.note(1175 * k, .07, .26, 'triangle'); this.note(1568 * k, .07, .2, 'sine', .08); },
  ng() { this.note(220, 0, .14, 'square', .14); this.note(165, .1, .26, 'square', .14); },
  flip() { this.note(520, 0, .06, 'sine', .08); this.note(780, .03, .07, 'sine', .06); },
  tap() { this.note(660, 0, .05, 'sine', .07); },
  combo() { [659, 784, 988, 1319].forEach((f, i) => this.note(f, i * .07, .18, 'triangle', .22)); },
  fanfare() {
    [[523, 0], [659, .12], [784, .24], [1047, .36], [784, .54], [1047, .66]].forEach(([f, t]) => this.note(f, t, .3, 'triangle', .25));
    [523, 659, 784, 1047].forEach(f => this.note(f, .9, 1.1, 'sine', .12));
  },
  loadVoices() { if (!('speechSynthesis' in window)) return; this.voices = speechSynthesis.getVoices(); renderVoices(); },
  pickVoice(lang) {
    const vs = this.voices;
    if (lang === 'en' && S.settings.voice) { const v = vs.find(v => v.voiceURI === S.settings.voice); if (v) return v; }
    const cand = vs.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
    return cand.find(v => /Samantha|Google US|Ava|Allison|Kyoko|O-Ren/.test(v.name)) || cand[0] || null;
  },
  say(text, lang = 'en') {
    if (!('speechSynthesis' in window) || S.settings.sp <= 0) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'ja-JP';
      const v = this.pickVoice(lang); if (v) u.voice = v;
      u.volume = S.settings.sp / 100;
      u.rate = (S.settings.rate / 100) * (lang === 'ja' ? 1.1 : 1);
      speechSynthesis.speak(u);
    } catch {}
  },
};

// =========================================================
// 演出（紙吹雪・粒・XP）
// =========================================================
const FX = {
  cv: null, cx: null, parts: [], raf: 0,
  setup() {
    this.cv = document.getElementById('fx'); this.cx = this.cv.getContext('2d');
    const r = () => { const d = devicePixelRatio || 1; this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.cx.setTransform(d, 0, 0, d, 0, 0); };
    r(); addEventListener('resize', r);
  },
  COLORS: ['#58cc02', '#1cb0f6', '#ff4b4b', '#ffc800', '#ce82ff', '#ff9600'],
  burst(x, y, n = 18, power = 7) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = power * (.4 + Math.random() * .8);
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: .28, s: 4 + Math.random() * 5, c: this.COLORS[i % 6], life: 1, dec: .022 + Math.random() * .02, shape: Math.random() < .5 ? 0 : 1, r: Math.random() * 6, vr: (Math.random() - .5) * .4 });
    }
    this.run();
  },
  confetti() {
    for (let i = 0; i < 160; i++) {
      this.parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, g: .06, s: 6 + Math.random() * 6, c: this.COLORS[i % 6], life: 1, dec: .0035, shape: 2, r: Math.random() * 6, vr: (Math.random() - .5) * .3, sway: Math.random() * 6 });
    }
    this.run();
  },
  run() {
    if (this.raf) return;
    const step = () => {
      const cx = this.cx; cx.clearRect(0, 0, innerWidth, innerHeight);
      this.parts = this.parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
      for (const p of this.parts) {
        p.vy += p.g; p.x += p.vx + (p.sway ? Math.sin(p.y / 30 + p.sway) * .8 : 0); p.y += p.vy; p.r += p.vr; p.life -= p.dec;
        cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
        if (p.shape === 0) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 7); cx.fill(); }
        else if (p.shape === 1) { cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); }
        else { cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2 * Math.abs(Math.cos(p.r * 2)) + 1); }
        cx.restore();
      }
      if (this.parts.length) this.raf = requestAnimationFrame(step); else { this.raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }
    };
    this.raf = requestAnimationFrame(step);
  },
  float(text, x, y) {
    const e = document.createElement('div'); e.className = 'xp'; e.textContent = text;
    e.style.left = (x - 20) + 'px'; e.style.top = (y - 30) + 'px';
    document.body.appendChild(e); setTimeout(() => e.remove(), 950);
  },
  praise(text) {
    const e = document.createElement('div'); e.className = 'praise jp'; e.textContent = text;
    document.getElementById('play').appendChild(e); setTimeout(() => e.remove(), 1150);
  },
};
function countUp(el, to, fmt = v => v, ms = 900) {
  const t0 = performance.now();
  const f = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

// =========================================================
// 画面
// =========================================================
const $ = id => document.getElementById(id);
let tab = 'sWords';
const mascotHTML = () => $('mascotT').innerHTML;
document.querySelectorAll('.m').forEach(m => m.innerHTML = mascotHTML());

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.toggle('playing', id === 'play' || id === 'sDone');
  if (['sWords', 'sFaces', 'sLog', 'sSet'].includes(id)) {
    tab = id; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  }
  if (id === 'sWords') renderHome('w');
  if (id === 'sFaces') renderHome('p');
  if (id === 'sLog') renderLog();
  if (id === 'sSet') renderSettings();
  if (id !== 'play') renderHud();
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1700); }
function todayXp() { const x = S.days[dayStr()]; return x ? (x.wc + x.pc) * 10 + (x.w - x.wc + x.p - x.pc) * 2 : 0; }
function renderHud() {
  const st = streak();
  document.querySelectorAll('[data-streak]').forEach(e => { e.querySelector('b').textContent = st; e.classList.toggle('off', st === 0); });
  document.querySelectorAll('[data-xp] b').forEach(e => e.textContent = todayXp());
  document.querySelectorAll('[data-gem]').forEach(e => e.querySelector('b').textContent = counts(e.dataset.gem).learned);
}
function say(type, done, goal, fin) {
  const u = type === 'w' ? '語' : '人', rem = goal - done;
  if (fin) return ['今日はクリア！天才すぎる', 'えらい！明日も待ってるね', '完璧！おかわりもできるよ'][done % 3];
  if (done === 0) return type === 'w' ? `今日は${goal}語。さあ、いこう！` : `今日は${goal}人。顔と名前、覚えよう！`;
  if (rem <= 20) return `ラストスパート！あと${rem}${u}！`;
  if (done / goal >= .5) return `半分こえた！あと${rem}${u}`;
  return `いい調子！あと${rem}${u}`;
}
function renderHome(type) {

  $(pre + 'Of').textContent = ` / ${t.goal}`;

  $(pre + 'Mix').innerHTML = `<span class="tagp n">新しい ${t.nw}</span><span class="tagp r">復習 ${t.rev}</span>` + (t.extra ? `<span class="tagp">追加 ${t.extra}</span>` : '');
  $(pre + 'Say').textContent = say(type, done, t.goal, fin);

  m.classList.toggle('joy', fin);

  $(pre + 'Start').disabled = fin;

  const c = counts(type);

function renderChips() {
  const box = $('gChips'); box.innerHTML = '';

  for (const [g, label] of Object.entries(GROUPS)) {

    b.textContent = `${label} ${n[g] || 0}`;
    b.onclick = () => {

let G = null;
function start(type) {

  G = { type, revealed: false, combo: 0, maxCombo: 0, ok: 0, n: 0, t0: Date.now(), undo: [], busy: false };
  $('play').style.setProperty('--c', type === 'w' ? 'var(--green)' : 'var(--purple)');
  show('play');
  load(true);
}
function curKey() { const t = S.today[G.type]; return t.q[t.pos]; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SPK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function load(first) {
  const t = S.today[G.type];

  const raw = curKey(), again = raw[0] === '!', key = raw.replace(/^!/, '');
  const c = S.cards[key];

  card.className = 'card'; card.style.transform = ''; card.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0);
  void card.offsetWidth; card.classList.add('enter');
  if (G.type === 'w') {

    fb.innerHTML = `<img class="avatar" src="${p.img}" alt=""><div class="pname">${esc(p.name)}</div><div class="pkana">${esc(p.kana)}</div><div class="psub">${esc(p.sub)}</div>` +
      (p.ses && p.ses.length ? `<div class="pses">🎤 ${p.ses.map(esc).join(' ／ ')}</div>` : '');
    const nk = t.q[t.pos + 1]; if (nk) { const np = pById[nk.replace(/^!/, '').slice(2)]; if (np) new Image().src = np.img; }
  }

  const cb = $('combo'); cb.textContent = `🔥 ${G.combo}連続`; cb.classList.toggle('on', G.combo >= 3);
}
function speakWord() {

function reveal() {

const PRAISE = ['すごい！', 'ナイス！', '天才！', 'その調子！', '止まらない！', '覚えてる！'];
function grade(ok) {

  const t = S.today[G.type], raw = curKey(), again = raw[0] === '!', key = raw.replace(/^!/, '');
  const log = dayLog();
  G.undo.push(JSON.stringify({ card: S.cards[key] || null, key, q: t.q, pos: t.pos, log, combo: G.combo, ok: G.ok, n: G.n }));
  if (G.undo.length > 5) G.undo.shift();
  const today = dayNum();
  if (!again) {
    const c = S.cards[key] || { b: 0, n: 0, w: 0 };
    const isNew = c.n === 0;
    c.n++;
    if (ok) c.b = isNew ? 2 : Math.min(c.b + 1, INT.length - 1);
    else { c.b = 1; c.w++; }
    c.d = today + INT[c.b]; c.l = today;
    S.cards[key] = c;
    const f = G.type === 'w' ? ['w', 'wc'] : ['p', 'pc'];
    log[f[0]]++; if (ok) log[f[1]]++;

  if (!ok && !again) { t.q = t.q.slice(); t.q.splice(Math.min(t.pos + 8, t.q.length), 0, '!' + key); }
  t.pos++;

  // 演出
  const card = $('card'), btn = $(ok ? 'bOk' : 'bNg').getBoundingClientRect();

    Sound.ok(G.combo); Haptic.ok();
    FX.burst(btn.left + btn.width / 2, btn.top + 10, 14, 6);
    FX.float('+10', btn.left + btn.width / 2, btn.top);
    if (G.combo > 0 && G.combo % 10 === 0) { setTimeout(() => { Sound.combo(); Haptic.big(); FX.praise(`🔥 ${G.combo}連続！`); FX.burst(innerWidth / 2, innerHeight * .42, 40, 11); }, 120); }
    else if (G.combo === 5 || (G.combo > 5 && Math.random() < .08)) FX.praise(PRAISE[Math.random() * PRAISE.length | 0]);
  } else { Sound.ng(); Haptic.ng(); card.classList.add('shake'); }
  setTimeout(() => {
    card.classList.remove('shake');

}
function undo() {

}

// スワイプ（右＝覚えた／左＝まだ）
(() => {
  const card = $('card'); let sx = 0, sy = 0, dx = 0, drag = false, moved = false;
  card.addEventListener('pointerdown', e => { if (!G || G.busy || e.target.closest('.speak')) return; drag = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; card.setPointerCapture(e.pointerId); card.classList.remove('enter'); });
  card.addEventListener('pointermove', e => {
    if (!drag) return; dx = e.clientX - sx;
    if (Math.abs(dx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true;
    if (!G.revealed) return;
    card.style.transition = 'none';
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.querySelector('.stamp.ok').style.opacity = Math.max(0, Math.min(1, dx / 90));
    card.querySelector('.stamp.ng').style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!drag) return; drag = false; card.style.transition = '';
    if (!G) return;
    if (G.revealed && Math.abs(dx) > 90) { grade(dx > 0); return; }
    card.style.transform = ''; card.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0);
    if (!moved) { if (!G.revealed) reveal(); else if (G.type === 'w') speakWord(); }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
})();

let cal = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
function streak() {
  let n = 0, d = dayNum();
  const act = ds => { const x = S.days[ds]; return x && (x.w + x.p) > 0; };
  if (!act(dayStr(d))) d--;
  while (act(dayStr(d))) { n++; d--; }
  return n;
}
function renderLog() {
  const days = Object.entries(S.days).filter(([, x]) => (x.w + x.p) > 0);
  countUp($('lStreak'), streak(), v => v, 600);
  $('lDays').textContent = days.length;
  $('lTotal').textContent = days.reduce((s, [, x]) => s + x.w + x.p, 0);
  $('cTitle').textContent = `${cal.y}年 ${cal.m + 1}月`;
  const g = $('cal'); g.innerHTML = '';
  '日月火水木金土'.split('').forEach(h => { const e = document.createElement('div'); e.className = 'h'; e.textContent = h; g.appendChild(e); });
  const first = new Date(cal.y, cal.m, 1).getDay(), last = new Date(cal.y, cal.m + 1, 0).getDate(), td = dayStr();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('div'));
  for (let d = 1; d <= last; d++) {
    const ds = `${cal.y}-${String(cal.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const x = S.days[ds], e = document.createElement('div');
    e.className = 'd' + (x && x.w + x.p > 0 ? ' has' : '') + (x && x.goalW ? ' goal' : '') + (ds === td ? ' today' : '');
    e.textContent = x && x.goalW ? '🔥' : d;
    e.onclick = () => {
      Haptic.tap(); g.querySelectorAll('.sel').forEach(s => s.classList.remove('sel')); e.classList.add('sel');
      if (!x || x.w + x.p === 0) { $('cDetail').textContent = `${ds}　記録なし`; return; }
      const r = (a, b) => a ? Math.round(b / a * 100) + '%' : '-';
      $('cDetail').textContent = `${ds}　単語 ${x.w}（正答 ${r(x.w, x.wc)}）　顔 ${x.p}（正答 ${r(x.p, x.pc)}）` + (x.old ? '　※旧版の記録' : '');
    };
    g.appendChild(e);
  }

}
function levels(type, el) {
  const keys = type === 'w' ? W.map(w => 'w:' + w.en) : P.map(p => 'p:' + p.id);
  const n = new Array(INT.length + 1).fill(0);
  keys.forEach(k => { const c = S.cards[k]; n[c ? c.b + 1 : 0]++; });
  const col = ['#e5e5e5', '#ff4b4b', '#ff9600', '#ffc800', '#a5ed6e', '#58cc02', '#1cb0f6', '#ce82ff'];
  el.innerHTML = n.map((v, i) => `<i style="width:0;background:${col[i]}"></i>`).join('');
  requestAnimationFrame(() => el.querySelectorAll('i').forEach((e, i) => e.style.width = (n[i] / keys.length * 100) + '%'));
}

function renderVoices() {

  sel.innerHTML = '<option value="">自動</option>' + en.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)} (${v.lang})</option>`).join('');

}
function renderSettings() {
  const s = S.settings;
  const bind = (id, key, fmt) => {
    const el = $('st' + id), v = $('v' + id);
    el.value = s[key]; v.textContent = fmt(s[key]);
    el.oninput = () => { s[key] = +el.value; v.textContent = fmt(s[key]); save(); };
  };
  bind('WordGoal', 'wordGoal', x => x + '語');
  bind('FaceGoal', 'faceGoal', x => x + '人');
  bind('Ratio', 'ratio', x => x + '%');
  bind('Eff', 'eff', x => x);
  bind('Sp', 'sp', x => x);
  bind('Rate', 'rate', x => (x / 100).toFixed(2) + '×');
  const sw = (id, key) => { const e = $(id); e.classList.toggle('on', !!s[key]); e.onclick = () => { s[key] = !s[key]; e.classList.toggle('on', s[key]); save(); Haptic.tap(); }; };
  sw('swHap', 'hap'); sw('swAuto', 'auto'); sw('swJa', 'ja'); sw('swName', 'name');
  renderVoices();
  $('stVoice').onchange = e => { s.voice = e.target.value; save(); Sound.say('available'); };

async function storeInfo() {
  let persisted = false;
  try { persisted = navigator.storage && await navigator.storage.persisted(); } catch {}
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  $('stStore').innerHTML = `記録はこの端末に二重で保存しています（1問ごと）。永続化：${persisted ? 'ON' : 'OFF'}` +
    (standalone ? '' : '<br>iPhoneは Safari の共有→「ホーム画面に追加」から開くと、記録が自動で消されなくなります。') +
    '<br>1日の目標を変えた場合は翌日の出題から反映されます。<br>カードは右スワイプで「覚えた」、左で「まだ」。';
}

async function boot() {
  const local = loadLocal();
  await IDB.open();
  let fromIdb = null;
  try { const v = await IDB.get(); fromIdb = v ? JSON.parse(v) : null; } catch {}
  const pick = (fromIdb && (!local || (fromIdb.updatedAt || 0) > (local.updatedAt || 0))) ? fromIdb : local;
  S = normalize(pick || {});
  if (!S.migrated) migrateV1(S);
  save();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  show(tab);
}
